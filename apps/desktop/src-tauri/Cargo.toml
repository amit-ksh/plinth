[package]
name = "plinth-desktop"
version = "0.1.0"
description = "Plinth: discount stacks that never sell below cost"
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "plinth_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Small installer: optimize for size, strip symbols, one codegen unit.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
